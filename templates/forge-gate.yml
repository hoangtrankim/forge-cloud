# The forge merge gate. It runs rules only, never an agent: once the reviewer has passed the
# PR's head commit, every check is green and the QA reporter has posted its evidence for that
# commit, it posts the factory/review status and merges the PR pinned to that commit. It also
# marks merged tickets done, sends changed PRs back to review, and brings main into PRs behind it.
#
# Risk tiers (risk.yml): it checks each PR's tier again from its diff. A high-risk PR is held:
# it merges after holdHours (factory.config.yml) unless the owner adds `hold` to the PR, and the
# owner adding `approve` merges it at once. The hourly schedule is the hold's clock.
#
# It acts as the forge-bot GitHub App, so the branches it updates still start CI. Set two repo
# secrets from that App: FORGE_BOT_APP_ID and FORGE_BOT_PRIVATE_KEY. Agents run elsewhere, in a
# Claude session (see the forge-loop skill).
name: forge gate

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  # The owner's `approve` or `hold` on a held PR. pull_request_target runs this file as it is
  # on main, and nothing below checks out the PR's code.
  pull_request_target:
    types: [labeled, unlabeled]
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

# One gate at a time per repo; a run that starts while another is going waits for it.
concurrency:
  group: forge-gate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    # forge leaves checks of this name out when it judges a PR's CI: a gate run started by a
    # PR label shows up as a check on that PR, and one cancelled by the concurrency group
    # would otherwise look like red CI.
    name: forge-gate
    # Skip events that cannot make a merge due: other labels on issues, and PR labels other
    # than the owner's approve and hold.
    if: >-
      (github.event_name != 'issues' && github.event_name != 'pull_request_target') ||
      (github.event_name == 'issues' && startsWith(github.event.label.name, 'factory:')) ||
      (github.event_name == 'pull_request_target' && contains(fromJSON('["approve","hold"]'), github.event.label.name))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ secrets.FORGE_BOT_APP_ID }}
          private-key: ${{ secrets.FORGE_BOT_PRIVATE_KEY }}
      # Checked out as forge-bot, so `forge logs push` below can write the factory-logs branch.
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Build forge from source: npm's git-dependency install skips the TypeScript build.
      - uses: actions/checkout@v4
        with:
          repository: hoangtrankim/forge-cloud
          path: .forge-cloud
      - run: npm ci && npm run build && npm install -g .
        working-directory: .forge-cloud
      - run: forge merge-gate
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
      # Keep this run's log lines: a GitHub runner is thrown away when the job ends.
      - run: forge logs push
        if: always()
